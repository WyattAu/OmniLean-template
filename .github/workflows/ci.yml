# lean-action runs lake build + lake test with elan + upstream cache.
# Monthly bitrot cron catches Lean/toolchain ecosystem drift.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *" # monthly bitrot

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          build: true
          test: false
          lint: false
          use-github-cache: true
      - run: lake exe test

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-contract.sh

  # Loop 2: performance budget. Advisory for one loop, then graduates to a
  # blocking gate (LOOP.md graduation policy). Same scripts/ commands the
  # developer runs locally - never a CI-only measurement path.
  perf:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          build: false
          test: false
          lint: false
          use-github-cache: false
      - run: make bench

  # Loop 3: determinism verification. Advisory for one loop, then blocking where
  # the toolchain is deterministic (LOOP.md graduation policy). Same
  # scripts/ command a developer runs locally.
  repro:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .
          build: false
          test: false
          lint: false
          use-github-cache: false
      - run: make repro
